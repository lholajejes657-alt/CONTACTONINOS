<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Niño Perdido - Contacto de Emergencia!</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8d7da; color: #721c24; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #dc3545; font-size: 24px; margin-bottom: 5px; }
        .alert { background: #dc3545; color: white; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; }
        .foto { width: 120px; height: 120px; border-radius: 50%; background: #ccc; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #666; overflow: hidden; border: 3px solid #dc3545; }
        .foto img { width: 100%; height: 100%; object-fit: cover; }
        .info { font-size: 18px; margin-bottom: 20px; color: #333; }
        .btn { display: block; background: #28a745; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: bold; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-whatsapp { background: #25d366; }
        .medical { background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; margin-top: 20px; text-align: left; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="alert">⚠️ ¡NIÑO PERDIDO! ⚠️</div>
        <div class="foto">Foto del Niño</div>
        
        <div class="info">
            <h2>Mateo García</h2>
            <p>Si me has encontrado solo, por favor ponte en contacto inmediatamente con mis padres o tutores.</p>
        </div>

        <!-- Reemplaza los números de teléfono con los tuyos (código de país + área + número sin espacios ni signos +) -->
        <a href="tel:+5491112345678" class="btn">📞 Llamar a Mamá (Laura)</a>
        <a href="https://wa.me/5491112345678?text=Hola,%20encontré%20a%20Mateo%20y%20necesito%20avisarles." class="btn btn-whatsapp">💬 Enviar WhatsApp</a>

        <div class="medical">
            <strong>⚠️ Información Médica Importante:</strong>
            <p>• Alergias: Ninguna<br>• Grupo Sanguíneo: O+</p>
        </div>
    </div>
</body>
</html>
